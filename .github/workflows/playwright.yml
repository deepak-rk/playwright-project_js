name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/mobilehub_e2e
      JWT_SECRET: ci_only_not_a_real_secret_replace_me_1234567890
      API_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout mobile-hub-e2e
        uses: actions/checkout@v4

      - name: Checkout mobile-hub
        uses: actions/checkout@v4
        with:
          repository: deepak-rk/mobile-hub
          path: mobile-hub

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install mobile-hub backend dependencies
        working-directory: mobile-hub/backend
        run: npm install

      - name: Start mobile-hub backend
        working-directory: mobile-hub/backend
        run: npm run dev &

      - name: Install mobile-hub-e2e dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
